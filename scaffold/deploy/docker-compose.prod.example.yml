# Public stack stub — скопируй в docker-compose.prod.yml и заполни TODO_.
# Usage (на сервере):
#   docker compose -f deploy/docker-compose.prod.yml --env-file /etc/TODO_SLUG/env up -d --build
# Canon: docs/deployment.md · docs/checklists/public-vps.md

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: TODO_DB_USER
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in env}
      POSTGRES_DB: TODO_DB_NAME
    volumes:
      - app_pg:/var/lib/postgresql/data
    # Internal only — not published to host
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U TODO_DB_USER -d TODO_DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - path: /etc/TODO_SLUG/env
        required: true
    environment:
      NO_RELOAD: "1"
      AUTH_REQUIRED: "1"
      TRUST_PROXY: "1"
      UVICORN_WORKERS: "1"
      HOST: "0.0.0.0"
      PORT: "8000"
      # DATABASE_URL: postgresql://TODO_DB_USER:${PG_PASSWORD}@db:5432/TODO_DB_NAME
    volumes:
      # Persistent data on host (adjust path)
      - /opt/TODO_SLUG/.data:/app/.data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: static / reverse-proxy in compose (или host nginx снаружи)
  # web:
  #   image: nginx:1.27-alpine
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #   restart: unless-stopped

volumes:
  app_pg:
